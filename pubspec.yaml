name: geopoint
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+3
environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  google_fonts: ^8.2.0
  shared_preferences: ^2.5.5
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_functions: ^6.4.0
  firebase_app_check: ^0.4.7
  google_sign_in: ^7.2.0
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/maps/
    - assets/data/


